{% extends 'store/base.html' %}

{% block content %}
<div class="max-w-md mx-auto py-12 px-4">
    <div class="bg-[#0b132b] border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black text-white">Welcome Back</h1>
            <p class="text-xs text-slate-400">Select your account type to sign in</p>
        </div>

        <!-- Role Selection Tabs -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900 border border-slate-800 rounded-xl">
            <button type="button" id="tab-buyer" onclick="setAccountType('buyer')" class="py-2 text-xs font-bold rounded-lg transition bg-amber-400 text-slate-950 shadow-md">
                Buyer Login
            </button>
            <button type="button" id="tab-seller" onclick="setAccountType('seller')" class="py-2 text-xs font-bold text-slate-400 hover:text-white rounded-lg transition">
                Seller Login
            </button>
        </div>

        <!-- Login Form -->
        <form method="POST" class="space-y-4 text-xs text-slate-200">
            {% csrf_token %}
            <input type="hidden" name="account_type" id="account_type_input" value="buyer">

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Username or Email</label>
                <input type="text" name="username" required placeholder="name@example.com or username" class="w-full px-3.5 py-2.5 bg-slate-900 text-white rounded-xl border border-slate-700 focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-900 text-white rounded-xl border border-slate-700 focus:outline-none focus:border-amber-400">
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl transition shadow-lg mt-4 cursor-pointer text-sm">
                Log In as Buyer
            </button>
        </form>

        <!-- Footer link to Sign Up -->
        <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-800">
            Don't have an account? 
            <a href="{% url 'signup' %}" class="text-amber-400 font-bold hover:underline">Sign up as a Seller or Buyer here</a>
        </div>
    </div>
</div>

<script>
function setAccountType(type) {
    const input = document.getElementById('account_type_input');
    const tabBuyer = document.getElementById('tab-buyer');
    const tabSeller = document.getElementById('tab-seller');
    const submitBtn = document.getElementById('submit-btn');

    input.value = type;
    if (type === 'seller') {
        tabSeller.className = 'py-2 text-xs font-bold rounded-lg transition bg-amber-400 text-slate-950 shadow-md';
        tabBuyer.className = 'py-2 text-xs font-bold text-slate-400 hover:text-white rounded-lg transition';
        submitBtn.textContent = 'Log In as Seller';
    } else {
        tabBuyer.className = 'py-2 text-xs font-bold rounded-lg transition bg-amber-400 text-slate-950 shadow-md';
        tabSeller.className = 'py-2 text-xs font-bold text-slate-400 hover:text-white rounded-lg transition';
        submitBtn.textContent = 'Log In as Buyer';
    }
}
</script>
{% endblock %}
