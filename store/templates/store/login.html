{% extends 'store/base.html' %}

{% block content %}
<style>
  .login-container {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  }

  .login-card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 440px;
    padding: 32px;
    box-sizing: border-box;
  }

  .login-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .login-header h2 {
    font-size: 26px;
    color: #1a202c;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .login-header p {
    color: #718096;
    font-size: 14px;
  }

  /* Buyer / Seller Role Selector Tabs */
  .role-toggle {
    display: flex;
    background: #edf2f7;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .role-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
    color: #4a5568;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
  }

  .role-btn.active {
    background: #0052cc;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(0, 82, 204, 0.3);
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #2d3748;
    margin-bottom: 6px;
  }

  .form-control {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
  }

  .form-control:focus {
    outline: none;
    border-color: #0052cc;
    box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    background: #0052cc;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s ease;
  }

  .submit-btn:hover {
    background: #003d99;
  }

  .login-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #718096;
  }

  .login-footer a {
    color: #0052cc;
    text-decoration: none;
    font-weight: 600;
  }

  .login-footer a:hover {
    text-decoration: underline;
  }
</style>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p id="sub-heading">Access your BLUE MARKET account</p>
    </div>

    <!-- Toggle between Buyer and Seller -->
    <div class="role-toggle">
      <button type="button" class="role-btn active" id="buyer-tab" onclick="switchRole('buyer')">Buyer Login</button>
      <button type="button" class="role-btn" id="seller-tab" onclick="switchRole('seller')">Seller Login</button>
    </div>

    <form method="POST" action="">
      {% csrf_token %}
      <input type="hidden" name="user_type" id="user_type" value="buyer">

      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="submit-btn" id="submit-button">Log In as Buyer</button>
    </form>

    <div class="login-footer">
      Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
    </div>
  </div>
</div>

<script>
  function switchRole(role) {
    const buyerTab = document.getElementById('buyer-tab');
    const sellerTab = document.getElementById('seller-tab');
    const userTypeInput = document.getElementById('user_type');
    const submitBtn = document.getElementById('submit-button');
    const subHeading = document.getElementById('sub-heading');

    if (role === 'buyer') {
      buyerTab.classList.add('active');
      sellerTab.classList.remove('active');
      userTypeInput.value = 'buyer';
      submitBtn.innerText = 'Log In as Buyer';
      subHeading.innerText = 'Access your buyer account & orders';
    } else {
      sellerTab.classList.add('active');
      buyerTab.classList.remove('active');
      userTypeInput.value = 'seller';
      submitBtn.innerText = 'Log In as Seller';
      subHeading.innerText = 'Access your seller dashboard & sales';
    }
  }
</script>
{% endblock %}
