{% extends 'store/base.html' %}
{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <a href="{% url 'index' %}" class="inline-flex items-center gap-2 text-xs text-amber-500 font-bold hover:underline mb-4">
        <i class="fa-solid fa-arrow-left"></i> Return to Fleet Catalog
    </a>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-2xl">
        <!-- Main Image -->
        <div class="space-y-4">
            <div class="rounded-2xl overflow-hidden border border-slate-800 bg-slate-950">
                {% if product.image_url %}
                    <img id="mainImage" src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-80 object-cover">
                {% else %}
                    <div class="h-80 flex items-center justify-center text-slate-700">
                        <i class="fa-solid fa-gears text-5xl"></i>
                    </div>
                {% endif %}
            </div>
        </div>

        <!-- Specifications & Direct WhatsApp Order -->
        <div class="space-y-6">
            <div>
                <h1 class="text-2xl font-black text-slate-100 mb-2">{{ product.name }}</h1>
                <p class="text-sm text-slate-400 whitespace-pre-line leading-relaxed">{{ product.description }}</p>
            </div>

            <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-slate-400 uppercase">Valuation / Price</span>
                    <span class="text-xl font-black text-amber-500">KES {{ product.price }}</span>
                </div>
            </div>

            <div class="p-4 border border-slate-800 rounded-2xl bg-slate-950 space-y-3">
                <h4 class="text-xs font-bold text-slate-300 uppercase">Order / Inquire via Direct Line</h4>
                <a href="https://wa.me/254741578860?text=Hello%20VANGUARD,%20I%20am%20inquiring%20about%20{{ product.name }}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Dispatch via WhatsApp
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
